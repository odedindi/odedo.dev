name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, format & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run check:all
        run: yarn check:all